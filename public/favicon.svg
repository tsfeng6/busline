<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- S-shaped path representing a bus line segment -->
  <path d="M120 180 C120 120, 392 120, 392 220 C392 320, 120 300, 120 390 C120 430, 392 430, 392 390" fill="none" stroke="url(#primary)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bus stops along the line -->
  <circle cx="120" cy="180" r="30" fill="#ffffff" stroke="#10b981" stroke-width="14"/>
  <circle cx="392" cy="220" r="30" fill="#ffffff" stroke="#10b981" stroke-width="14"/>
  <circle cx="210" cy="305" r="30" fill="#ffffff" stroke="#10b981" stroke-width="14"/>
  <circle cx="392" cy="390" r="30" fill="#ffffff" stroke="#10b981" stroke-width="14"/>
  
  <!-- Bus Icon Overlay at the center of the logo -->
  <g transform="translate(256, 170)">
    <rect x="-50" y="-40" width="100" height="90" rx="20" fill="#10b981"/>
    <rect x="-38" y="-28" width="76" height="32" rx="6" fill="#1e293b"/>
    <!-- Headlights -->
    <circle cx="-25" cy="26" r="10" fill="#fbbf24"/>
    <circle cx="25" cy="26" r="10" fill="#fbbf24"/>
    <!-- Grill/Bumper -->
    <rect x="-18" y="18" width="36" height="8" rx="4" fill="#1e293b"/>
  </g>
</svg>
