name: Update shared city lines
on:
  workflow_dispatch:
    inputs:
      city:
        description: City requested through the protected gateway
        required: true
        type: string
      request_id:
        description: Gateway-issued task UUID
        required: true
        type: string
      uploaded:
        description: Save browser-uploaded data without querying AMap again
        required: false
        default: false
        type: boolean
      diagnostic:
        description: Only make two small requests to diagnose provider quota and permissions
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: city-data-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect, validate and publish city JSON
        run: npm run city-data:update
        env:
          CITY_UPDATE_CITY: ${{ inputs.city }}
          CITY_UPDATE_DIAGNOSTIC_ONLY: ${{ inputs.diagnostic }}
          CITY_UPDATE_UPLOADED: ${{ inputs.uploaded }}
          CITY_UPDATE_REQUEST_ID: ${{ inputs.request_id }}
          CITY_UPDATE_GATEWAY_URL: ${{ vars.CITY_UPDATE_GATEWAY_URL }}
          CITY_UPDATE_CALLBACK_SECRET: ${{ secrets.CITY_UPDATE_CALLBACK_SECRET }}
          AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CITY_DATA_GITHUB_BRANCH: busline-data
          CITY_SEARCH_PAGE_LIMIT: '400'
          CITY_LINE_QUERY_LIMIT: '1500'
      - name: Retain non-sensitive collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: city-update-report
          path: city-update-report.json
          if-no-files-found: ignore
          retention-days: 7

  publish-site:
    needs: update
    if: ${{ success() && inputs.diagnostic != true }}
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
